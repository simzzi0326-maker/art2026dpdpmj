<title>중2 미술 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 가운데 한 열. 위에 단계 고르기, 가운데 칠판 모양 문제 카드, 아래에 보기와 해설.
   색: '온라인 미술실'과 같은 푸른 회색 바탕, 칠판 초록, 분필 노랑. 단계 색은 의미색으로 따로 둔다. */
:root{
  --bg:#e8edf1; --surface:#f7f9fa; --ink:#1a2230; --muted:#566273; --line:#cbd5de;
  --accent:#f2b705; --accent-ink:#1a2230;
  --board:#2d5a4e; --board-edge:#7a5a36; --chalk:#f4f1e6; --chalk-dim:#bfd0c8;
  --ok:#1d7a45; --ok-bg:#d9efe2; --bad:#b3362c; --bad-bg:#f6dedb;
  --lv1:#1d7a45; --lv2:#a87800; --lv3:#b3362c;
  --hover:#eef2f5;
  --display:'Do Hyeon','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151c; --surface:#19212b; --ink:#e8edf2; --muted:#9ba8b8; --line:#2d3a49;
    --board:#234438; --board-edge:#5a4228; --chalk:#f1eee3; --chalk-dim:#a9bdb4;
    --ok:#56c987; --ok-bg:#1c3a2a; --bad:#f08a80; --bad-bg:#3d2220;
    --lv1:#56c987; --lv2:#f2b705; --lv3:#f08a80;
    --hover:#212b37;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#19212b; --ink:#e8edf2; --muted:#9ba8b8; --line:#2d3a49;
  --board:#234438; --board-edge:#5a4228; --chalk:#f1eee3; --chalk-dim:#a9bdb4;
  --ok:#56c987; --ok-bg:#1c3a2a; --bad:#f08a80; --bad-bg:#3d2220;
  --lv1:#56c987; --lv2:#f2b705; --lv3:#f08a80;
  --hover:#212b37;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.6;
  padding-block:24px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(30px,6vw,42px);line-height:1.15}
.lead{margin:4px 0 0;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 단계 고르기 */
.levels{display:flex;flex-wrap:wrap;gap:8px}
.lvbtn{
  border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:7px 14px;display:inline-flex;align-items:center;gap:8px;font-size:15px;
}
.lvbtn:hover{background:var(--hover)}
.lvbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.25}
.dots i.on{opacity:1}

/* 진행 표시 */
.progress{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:22px;height:8px;border-radius:4px;background:var(--line)}
.pip.cur{background:var(--accent)}
.pip.ok{background:var(--ok)}
.pip.bad{background:var(--bad)}
.score{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}

/* 칠판 */
.board{
  background:var(--board);color:var(--chalk);
  border:10px solid var(--board-edge);border-radius:6px;
  padding:22px 22px 26px;position:relative;
  box-shadow:inset 0 0 40px rgba(0,0,0,.25);
}
.board::after{ /* 분필 받침 */
  content:"";position:absolute;left:12%;right:12%;bottom:-16px;height:6px;
  background:var(--board-edge);border-radius:0 0 4px 4px;
}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--chalk-dim);margin-bottom:10px}
.chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;
  border-radius:999px;padding:1px 10px;font-size:13px;
}
.chip.l1{color:#9fe3bb}.chip.l2{color:#ffd65c}.chip.l3{color:#ffaca3}
.qtext{font-family:var(--display);font-size:clamp(22px,4.4vw,30px);line-height:1.35;margin:0;text-wrap:pretty}
.qtype{font-size:13px;letter-spacing:.06em;color:var(--chalk-dim)}

/* 보기 */
.choices{display:grid;gap:10px;margin-top:6px}
.choices.ox{grid-template-columns:1fr 1fr}
.choice{
  text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:17px;min-width:0;
}
.choice:hover:not(:disabled){background:var(--hover);border-color:var(--muted)}
.choice:disabled{cursor:default}
.choice .key{
  flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);
  display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted);
}
.choice .label{min-width:0}
.swatches{display:inline-flex;gap:4px;margin-left:auto;flex:none}
.swatches i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.choices.ox .choice{justify-content:center;font-family:var(--display);font-size:44px;padding:14px;line-height:1}
.choices.ox .choice .key{display:none}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.right .key{border-color:var(--ok);color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .key{border-color:var(--bad);color:var(--bad)}
.choice.dim{opacity:.55}

/* 해설 */
.feedback{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;display:grid;gap:6px;
}
.feedback h3{font-size:22px}
.feedback.ok h3{color:var(--ok)}
.feedback.bad h3{color:var(--bad)}
.feedback p{margin:0;max-width:65ch}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{
  border:none;border-radius:10px;padding:11px 20px;font-weight:700;font-size:16px;
  background:var(--accent);color:var(--accent-ink);
}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:500}
.btn:hover{filter:brightness(1.05)}
.hint{font-size:13px;color:var(--muted);text-align:right;margin:0}

/* 결과 */
.result{display:grid;gap:16px}
.bigscore{font-family:var(--display);font-size:clamp(48px,12vw,72px);line-height:1;color:var(--chalk)}
.bigscore small{font-size:.4em;color:var(--chalk-dim)}
.breakdown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:2px}
.bk .n{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
.bk .t{font-size:14px;color:var(--muted)}
.bk.l1 .t{color:var(--lv1)}.bk.l2 .t{color:var(--lv2)}.bk.l3 .t{color:var(--lv3)}
.review{display:grid;gap:8px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:10px 14px}
.rv b{font-weight:700}
.rv p{margin:2px 0 0;color:var(--muted);font-size:15px}
.legend{font-size:14px;color:var(--muted);margin:0}
@media (max-width:480px){
  .breakdown{grid-template-columns:1fr}
  .board{border-width:7px;padding:18px 16px 22px}
}
@media (prefers-reduced-motion:no-preference){
  .board,.choices,.feedback{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(4px)}to{transform:none}}
}
</style>

<div class="wrap">
  <header>
    <h1>중2 미술 퀴즈</h1>
    <p class="lead">색채, 원근법, 조형 원리, 판화, 한국·서양 미술사에서 낸 10문제입니다. 단계를 골라 풀어 보세요.</p>
  </header>

  <div class="levels" role="group" aria-label="난이도 선택" id="levels"></div>
  <p class="legend">점수: 기초 1점 · 보통 2점 · 도전 3점 (전체 20점)</p>

  <main id="stage"></main>
</div>

<script>
const LEVELS = {
  1:{name:'기초',pts:1},
  2:{name:'보통',pts:2},
  3:{name:'도전',pts:3},
};

// type: 'ox' 이면 answer는 'O' 또는 'X', 'mc' 이면 보기 번호(0부터)
const QUESTIONS = [
  {lv:1,type:'ox',
   q:'색의 3속성은 색상, 명도, 채도이다.',
   answer:'O',
   why:'색상은 빨강·파랑 같은 색의 이름, 명도는 밝고 어두운 정도, 채도는 맑고 탁한 정도입니다.'},
  {lv:1,type:'mc',
   q:'물감(색료)의 삼원색으로 알맞은 것은?',
   options:[
     {t:'빨강 · 초록 · 파랑',sw:['#e53935','#43a047','#1e63d6']},
     {t:'자주(마젠타) · 노랑 · 청록(시안)',sw:['#e0218a','#ffd400','#00a3e0']},
     {t:'주황 · 초록 · 보라',sw:['#f57c00','#43a047','#7b3fa0']},
     {t:'검정 · 흰색 · 회색',sw:['#1a1a1a','#ffffff','#9e9e9e']},
   ],
   answer:1,
   why:'색료의 삼원색은 자주·노랑·청록이고, 섞을수록 어두워집니다(감산 혼합). 빨강·초록·파랑은 빛의 삼원색입니다.'},
  {lv:1,type:'ox',
   q:'보색끼리 섞으면 더 밝고 선명한 색이 된다.',
   answer:'X',
   why:'보색 물감을 섞으면 회색이나 검정에 가까운 탁한 색이 됩니다. 대신 나란히 놓으면 서로를 더 선명하게 보이게 합니다(보색 대비).'},
  {lv:2,type:'mc',
   q:'멀리 있는 산을 흐리고 푸르스름하게 그려 거리감을 나타내는 방법은?',
   options:[{t:'선 원근법'},{t:'공기(대기) 원근법'},{t:'역원근법'},{t:'다시점'}],
   answer:1,
   why:'공기 원근법은 공기층 때문에 먼 것일수록 색이 옅고 푸르게, 윤곽은 흐리게 보이는 현상을 이용합니다. 선 원근법은 소실점을 향해 선이 모이는 방법입니다.'},
  {lv:2,type:'mc',
   q:'같은 모양이나 색을 규칙적으로 되풀이해 율동감을 주는 조형 원리는?',
   options:[{t:'대비'},{t:'강조'},{t:'반복'},{t:'비례'}],
   answer:2,
   why:'반복은 같은 요소를 되풀이해 리듬과 통일감을 줍니다. 대비는 서로 다른 성질을 맞세우는 것, 강조는 한 부분을 두드러지게 하는 것입니다.'},
  {lv:2,type:'ox',
   q:'고무판화(볼록판화)를 찍으면 판에 새긴 그림과 좌우가 바뀌어 나온다.',
   answer:'O',
   why:'판화는 판을 종이에 엎어 찍기 때문에 좌우가 뒤집힙니다. 글자를 넣을 때는 판에 거꾸로 새겨야 합니다.'},
  {lv:2,type:'mc',
   q:'〈씨름〉, 〈서당〉처럼 조선 후기 서민들의 생활 모습을 생생하게 그린 화가는?',
   options:[{t:'김홍도'},{t:'정선'},{t:'안견'},{t:'신사임당'}],
   answer:0,
   why:'단원 김홍도는 간결한 선으로 서민의 일상을 그린 풍속화로 유명합니다. 안견은 〈몽유도원도〉, 신사임당은 초충도로 알려져 있습니다.'},
  {lv:3,type:'mc',
   q:'대상을 여러 방향에서 본 모습을 조각내어 한 화면에 함께 표현한 미술 사조는?',
   options:[{t:'인상주의'},{t:'야수주의'},{t:'입체주의'},{t:'초현실주의'}],
   answer:2,
   why:'피카소와 브라크가 이끈 입체주의는 하나의 시점에서 벗어나 여러 시점을 한 화면에 겹쳐 그렸습니다. 대표작으로 피카소의 〈아비뇽의 처녀들〉이 있습니다.'},
  {lv:3,type:'mc',
   q:'빛에 따라 달라지는 순간의 색을 담으려고 건초더미와 루앙 대성당을 시간대별로 여러 번 그린 화가는?',
   options:[{t:'빈센트 반 고흐'},{t:'클로드 모네'},{t:'살바도르 달리'},{t:'피트 몬드리안'}],
   answer:1,
   why:'모네는 인상주의의 대표 화가로, 같은 대상을 아침·한낮·저녁 빛 아래에서 연작으로 그렸습니다. 인상주의라는 이름도 그의 〈인상, 해돋이〉에서 나왔습니다.'},
  {lv:3,type:'ox',
   q:'겸재 정선의 〈인왕제색도〉는 중국의 산수를 상상해서 그린 관념 산수화이다.',
   answer:'X',
   why:'〈인왕제색도〉는 비 갠 뒤의 인왕산을 직접 보고 그린 진경산수화입니다. 정선은 우리 산천을 실제 모습대로 그리는 진경산수를 이끌었습니다.'},
];

const KEYS = ['①','②','③','④'];
let state = {filter:0, order:[], idx:0, answers:{}};

function maxPoints(list){return list.reduce((s,i)=>s+LEVELS[QUESTIONS[i].lv].pts,0)}
function earned(){
  return state.order.reduce((s,i)=>s+(state.answers[i]?.correct?LEVELS[QUESTIONS[i].lv].pts:0),0);
}
function dots(lv){return '<span class="dots">'+[1,2,3].map(n=>`<i class="${n<=lv?'on':''}"></i>`).join('')+'</span>'}

function start(filter){
  state.filter = filter;
  state.order = QUESTIONS.map((_,i)=>i).filter(i=>!filter||QUESTIONS[i].lv===filter);
  state.idx = 0; state.answers = {};
  renderLevels(); render();
}

function renderLevels(){
  const opts = [[0,'전체 10문제',null],[1,'기초',1],[2,'보통',2],[3,'도전',3]];
  document.getElementById('levels').innerHTML = opts.map(([v,label,lv])=>
    `<button class="lvbtn" id="lv-${v}" aria-pressed="${state.filter===v}" data-lv="${v}">${lv?dots(lv):''}${label}</button>`
  ).join('');
}
document.getElementById('levels').addEventListener('click',e=>{
  const b=e.target.closest('.lvbtn'); if(b) start(+b.dataset.lv);
});

function render(){
  const stage = document.getElementById('stage');
  if(state.idx >= state.order.length){ stage.innerHTML = resultHTML(); return; }
  const qi = state.order[state.idx], Q = QUESTIONS[qi], a = state.answers[qi];
  const pips = state.order.map((i,n)=>{
    const r = state.answers[i]; const c = r ? (r.correct?'ok':'bad') : (n===state.idx?'cur':'');
    return `<span class="pip ${c}"></span>`;
  }).join('');

  let choices;
  if(Q.type==='ox'){
    choices = `<div class="choices ox">${['O','X'].map(v=>btn(v, v, Q, a, v)).join('')}</div>`;
  } else {
    choices = `<div class="choices">${Q.options.map((o,n)=>{
      const sw = o.sw ? `<span class="swatches" aria-hidden="true">${o.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span>` : '';
      return btn(n, o.t, Q, a, KEYS[n], sw);
    }).join('')}</div>`;
  }

  let fb = '';
  if(a){
    const last = state.idx === state.order.length-1;
    const ansText = Q.type==='ox' ? Q.answer : `${KEYS[Q.answer]} ${Q.options[Q.answer].t}`;
    fb = `<div class="feedback ${a.correct?'ok':'bad'}" role="status">
        <h3>${a.correct?`정답! +${LEVELS[Q.lv].pts}점`:`아쉬워요. 정답은 ${ansText}`}</h3>
        <p>${Q.why}</p>
      </div>
      <div class="actions"><button class="btn" id="next">${last?'결과 보기':'다음 문제'}</button></div>`;
  } else {
    fb = `<p class="hint">${Q.type==='ox'?'키보드 O / X':'키보드 1–4'}로도 고를 수 있어요</p>`;
  }

  stage.innerHTML = `
    <div style="display:grid;gap:16px">
      <div class="progress">
        <div class="pips" aria-hidden="true">${pips}</div>
        <span>${state.idx+1} / ${state.order.length} · 점수 <span class="score">${earned()}</span> / ${maxPoints(state.order)}</span>
      </div>
      <section class="board" aria-live="polite">
        <div class="qmeta">
          <span class="chip l${Q.lv}">${dots(Q.lv)} ${LEVELS[Q.lv].name} · ${LEVELS[Q.lv].pts}점</span>
          <span class="qtype">${Q.type==='ox'?'O / X':'객관식'}</span>
        </div>
        <p class="qtext">${Q.q}</p>
      </section>
      ${choices}
      ${fb}
    </div>`;
  const nx = document.getElementById('next');
  if(nx){ nx.onclick = next; nx.focus({preventScroll:true}); }
}

function btn(val, text, Q, a, key, extra=''){
  let cls = 'choice';
  if(a){
    if(val===Q.answer) cls+=' right';
    else if(val===a.pick) cls+=' wrong';
    else cls+=' dim';
  }
  return `<button class="${cls}" data-v="${val}" ${a?'disabled':''} aria-label="${text}">
    <span class="key">${key}</span><span class="label">${Q.type==='ox'?text:text}</span>${extra}</button>`;
}

document.getElementById('stage').addEventListener('click',e=>{
  const b = e.target.closest('.choice'); if(!b||b.disabled) return;
  const qi = state.order[state.idx], Q = QUESTIONS[qi];
  pick(Q.type==='ox' ? b.dataset.v : +b.dataset.v);
});
document.getElementById('stage').addEventListener('click',e=>{
  if(e.target.id==='restart') start(state.filter);
  if(e.target.id==='retryWrong') retryWrong();
});

function pick(v){
  const qi = state.order[state.idx], Q = QUESTIONS[qi];
  if(state.answers[qi]) return;
  state.answers[qi] = {pick:v, correct: v===Q.answer};
  render();
}
function next(){ state.idx++; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function retryWrong(){
  const wrong = state.order.filter(i=>!state.answers[i]?.correct);
  state.order = wrong; state.idx = 0; state.answers = {};
  render();
}

function resultHTML(){
  const got = earned(), max = maxPoints(state.order);
  const per = [1,2,3].map(lv=>{
    const ids = state.order.filter(i=>QUESTIONS[i].lv===lv);
    return {lv, total:ids.length, ok:ids.filter(i=>state.answers[i]?.correct).length};
  }).filter(x=>x.total);
  const wrong = state.order.filter(i=>!state.answers[i]?.correct);
  const ratio = max? got/max : 0;
  const msg = ratio===1 ? '만점이에요. 미술 개념을 탄탄하게 알고 있네요.'
    : ratio>=.7 ? '잘했어요. 틀린 문제의 해설만 다시 읽어 보세요.'
    : ratio>=.4 ? '기본은 잡혀 있어요. 틀린 문제를 다시 풀어 보세요.'
    : '교과서의 색채와 미술사 단원을 한 번 더 살펴보고 다시 도전해 보세요.';
  return `<div class="result">
    <section class="board">
      <div class="qmeta"><span class="qtype">결과</span></div>
      <div class="bigscore">${got}<small> / ${max}점</small></div>
      <p class="qtext" style="font-size:clamp(18px,3.6vw,22px);margin-top:10px">${msg}</p>
    </section>
    <div class="breakdown">${per.map(p=>`
      <div class="bk l${p.lv}"><span class="t">${dots(p.lv)} ${LEVELS[p.lv].name}</span><span class="n">${p.ok} / ${p.total}</span></div>`).join('')}
    </div>
    ${wrong.length?`<div class="review"><h3 style="font-size:22px">틀린 문제 다시 보기</h3>${wrong.map(i=>{
      const Q=QUESTIONS[i]; const ans = Q.type==='ox'?Q.answer:Q.options[Q.answer].t;
      return `<div class="rv"><b>${Q.q}</b><p>정답: ${ans} · ${Q.why}</p></div>`;}).join('')}</div>`:''}
    <div class="actions">
      ${wrong.length?'<button class="btn ghost" id="retryWrong">틀린 문제만 다시</button>':''}
      <button class="btn" id="restart">처음부터 다시</button>
    </div>
  </div>`;
}

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(state.idx>=state.order.length) return;
  const qi = state.order[state.idx], Q = QUESTIONS[qi];
  if(state.answers[qi]){ if(e.key==='Enter'&&document.activeElement?.id!=='next'){ next(); } return; }
  const k = e.key.toUpperCase();
  if(Q.type==='ox' && (k==='O'||k==='X')) pick(k);
  if(Q.type==='mc' && /^[1-4]$/.test(e.key)) pick(+e.key-1);
});

function boot(saved){
  if(saved && saved.order){ state = saved; renderLevels(); render(); }
  else start(0);
}
window.claude?.hot?.snapshot?.(()=>state);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data);
</script>
